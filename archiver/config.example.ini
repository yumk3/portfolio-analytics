# ETF archiver settings - TEMPLATE. Copy to archiver\config.ini (gitignored)
# and replace the example paths and funds with your own.
# Relative paths are relative to the repo root (the folder above archiver\).

[paths]
# Every raw download lands here as <raw_root>\YYYY-MM-DD\<TICKER>_<issuer>.<ext>,
# where YYYY-MM-DD is the day it was downloaded. Gitignored. Irreplaceable.
raw_root = data/raw/etf_holdings

# Best-effort tidy copies, rebuilt from raw at any time.
parsed_root = data/parsed/etf_holdings

# Run logs: logs\etf_archiver_YYYY-MM-DD.log
log_dir = logs

# Shared DuckDB file (job_runs table).
db_path = data/portfolio.duckdb

# One-way copy of new raw files after each run, e.g. into a cloud-synced
# folder. Never read from, never deleted from. If the folder is unavailable
# the run warns and carries on. Leave blank to switch the backup off.
backup_root = C:\path\to\cloud-backup\etf_archive_raw

[run]
# The Python the archiver should run under (named in the plain-English
# 'wrong Python' message) and the windowless one the scheduled task uses.
expected_python = C:\path\to\venv\Scripts\python.exe
task_python = C:\path\to\venv\Scripts\pythonw.exe

[migration]
# Only for archiver\migrate_history.py (a one-off import of an older archive).
previous_raw = C:\path\to\old\archive\raw
dry_run_raw = C:\path\to\test-run\raw
manual_file = C:\path\to\Downloads\XYZ_holdings.csv
manual_ticker = XYZ
manual_note = hand-downloaded file
legacy_log_note = original run log

# ---------------------------------------------------------------------------
# FUNDS - the single list of tracked ETFs, in processing order.
# Used by archiver\etf_archiver.py (downloads) and scripts\seed_funds.py
# (funds table). One [fund TICKER] section each:
#   issuer         how the archiver downloads it: ssga | invesco | ishares | generic | manual
#   product_id     iShares product id, or the CUSIP for Invesco
#   url_template   generic/iShares URL with {TICKER}
#   file_type      csv | xlsx | json (generic only)
#   fetch_method   cffi | manual
#   issuer_name, cusip, archive_status, status_note, last_attempted_at
#                  copied into the funds table by seed_funds.py (blank = NULL)
# ---------------------------------------------------------------------------

[fund SPY]
issuer = ssga
